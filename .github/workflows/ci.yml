name: Verify

on:
  push:
  pull_request:

jobs:
  unit-and-dbt-parse:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_USER: admin
      DB_PASSWORD: test-password
      DB_NAME: bicam_collection
      DB_SCHEMA: public
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run dbt parse --project-dir dbt_project --no-partial-parse

