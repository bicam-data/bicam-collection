name: CI/CD Pipeline

on:
  push:
    branches: [ main, productionize ]
  pull_request:
    branches: [ main, productionize ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      run: pip install uv
    
    - name: Install dependencies
      run: uv sync --extra dev
    
    - name: Run Ruff linting
      run: uv run ruff check .
    
    - name: Run Black formatting check
      run: uv run black --check --diff .
    
    - name: Run MyPy type checking
      run: uv run mypy src/bicam_collection

  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_bicam
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      run: pip install uv
    
    - name: Install dependencies
      run: uv sync --extra dev
    
    - name: Set up test environment
      env:
        POSTGRESQL_HOST: localhost
        POSTGRESQL_PORT: 5432
        POSTGRESQL_DATABASE: test_bicam
        POSTGRESQL_USER: test_user
        POSTGRESQL_PASSWORD: test_pass
        GOVINFO_API_KEY: test_key
        CONGRESS_API_KEYS: test_key1,test_key2
        ENVIRONMENT: test
      run: |
        echo "POSTGRESQL_HOST=localhost" >> .env
        echo "POSTGRESQL_PORT=5432" >> .env
        echo "POSTGRESQL_DATABASE=test_bicam" >> .env
        echo "POSTGRESQL_USER=test_user" >> .env
        echo "POSTGRESQL_PASSWORD=test_pass" >> .env
        echo "GOVINFO_API_KEY=test_key" >> .env
        echo "CONGRESS_API_KEYS=test_key1,test_key2" >> .env
        echo "ENVIRONMENT=test" >> .env
    
    - name: Run unit tests
      run: uv run pytest tests/unit -v --cov=src/bicam_collection --cov-report=xml --cov-report=term-missing
    
    - name: Run integration tests
      run: uv run pytest tests/integration -v -m "not slow"
      env:
        POSTGRESQL_HOST: localhost
        POSTGRESQL_PORT: 5432
        POSTGRESQL_DATABASE: test_bicam
        POSTGRESQL_USER: test_user
        POSTGRESQL_PASSWORD: test_pass
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      run: pip install uv
    
    - name: Build package
      run: uv build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      run: pip install uv
    
    - name: Install dependencies
      run: uv sync --extra dev
    
    - name: Run safety check
      run: uv run pip-audit
      continue-on-error: true  # Don't fail CI on security issues, just report them 