# Prefix drop-in: systemd applies bicam-.service.d/ to every bicam-*.service.
# The alert template is deliberately not bicam- prefixed so this drop-in does
# not apply to it and a failing alert cannot re-trigger itself.

[Unit]
OnFailure=alert-bicam-lane@%n.service

[Service]
# ExecStopPost= runs for every outcome, including timeouts and signals, and
# its own failure never changes the unit's result.  record_lane_run.py still
# exits 0 on any error so the journal stays clean.
ExecStopPost=/home/rdelano/bicam/bicam-collection/.venv/bin/python /home/rdelano/bicam/bicam-collection/scripts/record_lane_run.py --unit %n --invocation-id $INVOCATION_ID --service-result $SERVICE_RESULT --exit-code $EXIT_CODE --exit-status $EXIT_STATUS
