[Service]
# The active service invokes run_govinfo_incremental_windows.sh, which uses
# date-window settings (the older cursor_* names are for a separate historical
# helper and had no effect here).  Keep the polling lane resumable and bounded:
# four six-hour windows can catch up a short outage without multiplying the
# three-key request pool or the 0.25-second pacer.  Operators can raise
# WINDOW_MAX_WINDOWS for a deliberately larger catch-up batch.
Environment=BICAM_GOVINFO_WINDOW_HOURS=6
Environment=BICAM_GOVINFO_WINDOW_LAG_MINUTES=5
Environment=BICAM_GOVINFO_WINDOW_MINIMUM_MINUTES=5
Environment=BICAM_GOVINFO_WINDOW_MAX_WINDOWS=4
Environment=BICAM_GOVINFO_WINDOW_PAGE_SIZE=100
Environment=BICAM_GOVINFO_WINDOW_CONCURRENCY=3
Environment=BICAM_GOVINFO_WINDOW_REQUEST_INTERVAL=0.25
