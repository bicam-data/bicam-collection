[Timer]
# Date windows are independently resumable and include all four collections.
# Replace the unit's six-hour default with one deliberate hourly trigger so
# newly modified packages are harvested after a short source-lag buffer without
# also retaining a second six-hour trigger. Keep the trigger at minute :01:
# the lineage lane starts at :06/:21/:36/:51 and normally needs about four
# minutes, so a fixed phase prevents an hourly lock-busy collision from
# repeatedly starving the GovInfo lane.
OnUnitActiveSec=
OnCalendar=*:01:00
