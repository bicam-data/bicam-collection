[Service]
# The live header is credential-scoped.  A coordinated 429 window has also
# been observed at the current egress, so increase this lane in a bounded,
# lock-held step rather than treating unrelated credentials as one quota.
Environment=BICAM_RAMP_GLOBAL_RATE_LIMIT=18000
Environment=BICAM_RAMP_MAX_NEW_429=3
# Bounded child batches at 0.20s pacing (~18k attempts/hour target), below the
# coordinated 20k/hour window observed across all credentials.
Environment=BICAM_RAMP_REQUEST_INTERVAL=0.20
Environment=BICAM_RAMP_CONCURRENCY=8
Environment=BICAM_RAMP_CATEGORY_WORKERS=2
Environment=BICAM_RAMP_ACTIVE_KEY_BUDGET=15
# The historical partition queue is complete.  Verify 25 bounded root batches
# per lock acquisition so the durable keyset scan advances without a systemd
# restart and checkpoint pair after every 500 roots.  The service-level 2 GiB
# cap and API-pressure guard remain unchanged.
Environment=BICAM_RAMP_MAX_BATCHES=25
Environment=BICAM_RAMP_CURSOR_PATH=%h/bicam/reports/congress-descendant-refresh-cursor.json
# The historical partition queue can legitimately hold the shared lock for
# hours while walking bill descendants. Keep this companion lane waiting
# instead of timing out and restarting every five minutes.
Environment=BICAM_RAMP_LOCK_WAIT_SECONDS=7200
# Do not spin/log rapidly while a server-provided cooldown marker is active.
RestartSec=30s
