[Service]
# The live token counters remain per-credential.  Move the historical queue to
# the next bounded pressure-test step; the wrapper stops on coordinated 429s
# and writes a durable cooldown/cursor before any retry.
Environment=BICAM_PARTITION_GLOBAL_RATE_LIMIT=18000
Environment=BICAM_PARTITION_REQUEST_INTERVAL=0.20
Environment=BICAM_PARTITION_CONCURRENCY=8
Environment=BICAM_PARTITION_CATEGORY_WORKERS=2
Environment=BICAM_PARTITION_ACTIVE_KEY_BUDGET=15
