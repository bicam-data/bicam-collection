- name: bills
  description: Congressional bills main data

  api:
    expected_key: bill
    outer_field: bill
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: bills
    is_main: true
    create_raw: true
    id_fields: [bill_id]
    related_tables:
      - actions
      - cosponsors
      - subjects
      - summaries
      - texts
      - titles
      - relatedbills
    fields:
      - name: bill_id
        type: string
      - name: bill_type
        type: string
      - name: number
        type: string
      - name: congress
        type: integer
      - name: title
        type: string
      - name: origin_chamber
        type: string
      - name: update_date
        type: timestamp

  processing:
    batch_size: 100
    checkpoint_frequency: 50

