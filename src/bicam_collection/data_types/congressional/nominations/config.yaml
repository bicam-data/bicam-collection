- name: nominations_nominees
  description: Nomination nominees data
  
  api:
    expected_key: nominee
    outer_field: nominees
    page_size: 250
    retry_attempts: 3
  
  schema:
    table_name: nominations_nominees
    is_main: false
    create_raw: true
    id_fields: [nomination_id, position_id, nominee_ordinal]
    fields:
      - name: nomination_id
        type: string
      - name: position_id
        type: integer
      - name: nominee_ordinal
        type: integer
      - name: first_name
        type: string
      - name: middle_name
        type: string
      - name: last_name
        type: string
      - name: prefix
        type: string
      - name: suffix
        type: string
