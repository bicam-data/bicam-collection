- name: amendments_actions
  description: Amendment actions data
  
  api:
    expected_key: action
    outer_field: actions
    page_size: 250
    retry_attempts: 3
  
  schema:
    table_name: amendments_actions
    is_main: false
    create_raw: true
    id_fields: [action_id]
