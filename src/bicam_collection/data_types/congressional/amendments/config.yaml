- name: amendments_texts
  description: Amendment texts data
  
  api:
    expected_key: text
    outer_field: texts
    page_size: 250
    retry_attempts: 3
  
  schema:
    table_name: amendments_texts
    is_main: false
    create_raw: true
    id_fields: [amendment_id, date, type]
    fields:
      - name: amendment_id
