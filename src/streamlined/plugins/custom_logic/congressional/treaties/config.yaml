- name: treaties
  description: Congressional treaties main data

  api:
    api_endpoint: treaty
    list_key: treaties
    full_key: treaty
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: treaties
    is_main: true
    create_raw: true
    id_fields: [treaty_id]
    related_tables:
      - actions
      # - countries
      # - indexterms
      - committeeactivities
      # - titles
      # - committeereports

  processing:
    batch_size: 100
    checkpoint_frequency: 50

- name: treaties_indexterms
  description: Treaty index terms data

  schema:
    table_name: treaties_indexterms
    is_main: false
    create_raw: false
    id_fields: [treaty_id, index_term]
    related_tables:
      - indexterms

  processing:
    batch_size: 500
    checkpoint_frequency: 250

- name: treaties_titles
  description: Treaty titles data

  schema:
    table_name: treaties_titles
    is_main: false
    create_raw: false
    id_fields: [treaty_id, title, title_type]

  processing:
    batch_size: 100
    checkpoint_frequency: 50

- name: treaties_actions
  description: Treaty actions data

  api:
    api_endpoint: actions
    list_key: actions
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: treaties_actions
    is_main: false
    create_raw: true
    id_fields: [action_id, treaty_id]

  processing:
    batch_size: 500
    checkpoint_frequency: 250

- name: treaties_countries
  description: Treaty countries data

  schema:
    table_name: treaties_countries
    is_main: false
    create_raw: false
    id_fields: [treaty_id, country]

  processing:
    batch_size: 500
    checkpoint_frequency: 250

- name: treaties_committeeactivities
  description: Treaty committees data

  api:
    api_endpoint: committees
    list_key: committees
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: treaties_committeeactivities
    is_main: false
    create_raw: true
    id_fields: [treaty_id, committee_code, activity_date, activity_name]

  processing:
    batch_size: 500
    checkpoint_frequency: 250
