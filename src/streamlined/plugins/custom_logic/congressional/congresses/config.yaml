- name: congresses
  description: Congressional congresses main data

  api:
    list_key: congresses
    full_key: congress
    api_endpoint: congress
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: congresses
    is_main: true
    create_raw: true
    id_fields: [congress_number]
    related_tables:
      - sessions

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    scaling_factor: 1

- name: congresses_sessions
  description: Congressional sessions data

  schema:
    table_name: congresses_sessions
    is_main: false
    create_raw: true
    id_fields: [congress_number, session, chamber, type]

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    scaling_factor: 1
