- name: hearings
  description: Congressional hearings main data

  api:
    list_key: hearings
    full_key: hearing
    api_endpoint: hearing
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: hearings
    is_main: true
    create_raw: true
    id_fields: [hearing_id]
    related_tables:
      - committees
      - dates
      - texts

  processing:
    batch_size: 100
    checkpoint_frequency: 50

- name: hearings_committees
  description: Hearing committees data

  schema:
    table_name: hearings_committees
    is_main: false
    create_raw: false
    id_fields: [hearing_id, committee_code]

  processing:
    batch_size: 500
    checkpoint_frequency: 250

- name: hearings_dates
  description: Hearing dates data

  schema:
    table_name: hearings_dates
    is_main: false
    create_raw: false
    id_fields: [hearing_id, hearing_date]

  processing:
    batch_size: 500
    checkpoint_frequency: 250

- name: hearings_texts
  description: Hearing texts data

  schema:
    table_name: hearings_texts
    is_main: false
    create_raw: false
    id_fields: [hearing_id, pdf, formatted_text]

  processing:
    batch_size: 200
    checkpoint_frequency: 100
