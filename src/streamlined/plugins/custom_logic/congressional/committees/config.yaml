- name: committees
  description: Congressional committees main data

  api:
    api_endpoint: committee
    list_key: committees
    full_key: committee
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: committees
    is_main: true
    create_raw: true
    id_fields: [committee_code]
    related_tables:
      - committeereports
      - bills

  processing:
    batch_size: 50
    checkpoint_frequency: 25
    scaling_factor: 20

  parallel_related_data:
    enabled: true
    threshold_pages: 10  # Only parallelize if more than 10 pages
    max_workers: 4       # Maximum workers for related data pagination
    related_types:
      bills:
        pagination_metadata_method: "get_committees_bills_pagination_metadata"
        page_fetch_method: "get_committees_bills_page"
        list_key: ["committee-bills", "bills"]
        page_size: 250
      communications:  # Add this new section
        pagination_metadata_method: "get_committees_communications_pagination_metadata"
        page_fetch_method: "get_committees_communications_page"
        list_key: ["communications"]
        page_size: 250

- name: committees_subcommittees
  description: Congressional committees subcommittees data

  schema:
    table_name: committees_subcommittees
    is_main: false
    create_raw: true
    id_fields: [committee_code, subcommittee_code]

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    scaling_factor: 50

- name: committees_history
  description: Congressional committees history data

  schema:
    table_name: committees_history
    is_main: false
    create_raw: false
    id_fields: [committee_code, started_at, ended_at]

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    scaling_factor: 50

- name: committees_committeereports
  description: Congressional committees reports data

  api:
    api_endpoint: reports
    list_key: reports

  schema:
    table_name: committees_committeereports
    is_main: false
    create_raw: true
    id_fields: [committee_code, report_id]

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    scaling_factor: 50

