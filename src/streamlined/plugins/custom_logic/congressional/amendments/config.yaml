- name: amendments
  description: Congressional amendments main data

  api:
    api_endpoint: amendment
    list_key: amendments
    full_key: amendment
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: amendments
    is_main: true
    create_raw: true
    id_fields: [amendment_id]
    related_tables:
      - sponsors
      - cosponsors
      - on_behalf_of
      - links
      - amended_bills
      - amended_treaties
      - amended_amendments
      - actions
      - texts

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    scaling_factor: 50

- name: amendments_sponsors
  description: Amendment sponsors data

  schema:
    table_name: amendments_sponsors
    is_main: false
    create_raw: false
    id_fields: [amendment_id, bioguide_id]

  processing:
    batch_size: 500
    checkpoint_frequency: 250
    scaling_factor: 50

