- name: bills
  description: Congressional bills main data

  api:
    list_key: bills
    full_key: bill
    api_endpoint: bill
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: bills
    is_main: true
    create_raw: true
    id_fields: [bill_id]
    related_tables:
      - actions
      - cosponsors
      - subjects
      - summaries
      - texts
      - titles
      - relatedbills
      - committeeactivities
      - notes

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    scaling_factor: 100

- name: bills_actions
  description: Congressional bills actions data

  api:
    list_key: actions
    api_endpoint: actions
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: bills_actions
    is_main: false
    create_raw: true
    id_fields: [bill_id, action_id]
    related_tables:
      - committees
      - recordedvotes

  processing:
    batch_size: 100
    scaling_factor: 100

