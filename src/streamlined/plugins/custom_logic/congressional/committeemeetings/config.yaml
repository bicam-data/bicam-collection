- name: committeemeetings
  description: Congressional committee meetings main data
  
  api:
    api_endpoint: committee-meeting
    list_key: committeeMeetings
    full_key: committeeMeeting
    page_size: 250
    retry_attempts: 3

  schema:
    table_name: committeemeetings
    is_main: true
    create_raw: true
    id_fields: [meeting_id]
    related_tables:
      # - bills
      # - treaties
      # - nominations
      - meetingdocuments
      - videos
      - witnessdocuments
      - witnesses
      - hearings
      - committees

  processing:
    batch_size: 100
    checkpoint_frequency: 50

- name: committeemeetings_committees
  description: Committee meetings committees data

  schema:
    table_name: committeemeetings_committees
    is_main: false
    create_raw: true
    id_fields: [meeting_id, committee_code]

  processing:
    batch_size: 500
    checkpoint_frequency: 250

