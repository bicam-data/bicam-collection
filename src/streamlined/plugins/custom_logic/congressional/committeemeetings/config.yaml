- name: committeemeetings_witnesses
  description: Committee meetings witnesses data

  schema:
    table_name: committeemeetings_witnesses
    is_main: false
    create_raw: false
    id_fields: [meeting_id, name, position, organization]

  processing:
    batch_size: 500
    checkpoint_frequency: 250
    scaling_factor: 20

- name: committeemeetings_witnessdocuments
  description: Committee meetings witness documents data

  schema:
    table_name: committeemeetings_witnessdocuments
    is_main: false
    create_raw: false
    id_fields: [meeting_id, document_type, format, url]

  processing:
    batch_size: 500
    checkpoint_frequency: 250

- name: committeemeetings_videos
  description: Committee meetings videos data

  schema:
    table_name: committeemeetings_videos
    is_main: false
    create_raw: false
    id_fields: [meeting_id, video_name, url]

  processing:
    batch_size: 500
    checkpoint_frequency: 250

- name: committeemeetings_meetingdocuments
  description: Committee meetings meeting documents data

  schema:
    table_name: committeemeetings_meetingdocuments
    is_main: false
    create_raw: false
    id_fields: [meeting_id, document_name, document_type, description, format, url]

  processing:
    batch_size: 500
    checkpoint_frequency: 250

- name: committeemeetings_hearingtranscript
  description: Committee meetings hearings data (will be routed to hearings table)

  schema:
    table_name: committeemeetings_hearingtranscript
    is_main: false
    create_raw: false
    id_fields: [meeting_id, hearing_id]

  processing:
    batch_size: 500
    checkpoint_frequency: 250