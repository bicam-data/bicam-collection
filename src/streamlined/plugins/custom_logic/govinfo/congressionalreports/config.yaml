- name: congressionalreports
  description: GovInfo Congressional Reports main data

  api:
    api_endpoint: CRPT
    page_size: 1000
    retry_attempts: 3

  schema:
    table_name: congressionalreports

    is_main: true
    create_raw: true
    id_fields: [package_id]
    related_tables:
    - granules
    - committees
    - members
    - bills
    - serialset
    - ils_system_id
    - reference_codes
    - reference_codes_sections
    - reference_laws
    - reference_statutes
    - reference_statutes_pages

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    has_granules: true

- name: granules
  description: Congressional Reports granule data

  api:
    page_size: 1000
    retry_attempts: 3

  schema:
    table_name: granules
    is_main: false
    create_raw: true
    id_fields: [granule_id]

  processing:
