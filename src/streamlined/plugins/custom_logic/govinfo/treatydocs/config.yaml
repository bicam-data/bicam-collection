- name: treatydocs
  description: GovInfo Congressional Directories main data

  api:
    api_endpoint: CDOC
    doc_class: TDOC
    page_size: 1000
    retry_attempts: 3

  schema:
    table_name: treatydocs

    is_main: true
    create_raw: true
    id_fields: [package_id]
    related_tables:
    - granules

  processing:
    batch_size: 100
    checkpoint_frequency: 50
    has_granules: true
    scaling_factor: 50

- name: granules
  description: Treaty Docs granule data

  api:
    page_size: 1000
    retry_attempts: 3

  schema:
    table_name: granules
    is_main: false
    create_raw: true
    id_fields: [granule_id]

  processing:
    batch_size: 100
    scaling_factor: 50