# Bicam Collection Configuration File
# This is a comprehensive sample configuration showing all available options

# Environment settings
environment: development  # development, staging, production
debug: false

# Database configuration
database:
  host: localhost
  port: 5432
  database: bicam_collection
  username: postgres
  password: your_password_here
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30

# Scraping configuration
scraping:
  congressional_api_key: YOUR_CONGRESSIONAL_API_KEY
  govinfo_api_key: YOUR_GOVINFO_API_KEY
  max_concurrent_requests: 10
  request_timeout: 30
  retry_attempts: 3
  retry_delay: 1.0
  rate_limit_delay: 0.1
  output_directory: /tmp/bicam-data

# Data processing configuration
processing:
  chunk_size: 1000
  max_workers: 4
  temp_directory: /tmp/bicam-processing
  memory_limit_gb: 4.0
  enable_parallel_processing: true

# Export configuration
export:
  export_directory: /tmp/bicam-exports
  export_formats:
    - csv
    - parquet
  compress_exports: true
  s3_bucket: null  # Optional: your-s3-bucket-name
  s3_prefix: null  # Optional: path/prefix/

# Lobbyist matching configuration
lobbyist_matching:
  similarity_threshold: 0.8
  batch_size: 1000
  timeout_seconds: 300
  enable_fuzzy_matching: true

# Logging configuration
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_file: null  # Optional: /path/to/logfile.log
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  enable_structured_logging: true
  log_to_console: true

# Schema configuration paths
congressional_config_path: configs/congressional_config.yaml
govinfo_config_path: configs/govinfo_config.yaml 