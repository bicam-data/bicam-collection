contract_version: 4
contract_kind: public_product_schema
product:
  name: bicam
  postgres_schema: bicam
  release: 2025
  description: >-
    The public, relational BICAM product. Main relations are plural nouns;
    child relations use the plural main-table name as their prefix.
  reference_documents:
    - title: "Bulk Ingestion of Congressional Actions and Materials Dataset"
      doi: 10.1038/s41597-025-05737-8
      url: https://doi.org/10.1038/s41597-025-05737-8
      use: >-
        Defines the eleven components, CSV/sub-component delivery convention,
        official Congress.gov/GovInfo source policy, and external-linkage scope.
  legacy_crosswalk_policy: >-
    Legacy identifier crosswalks are not part of the core product. They remain
    explicitly named relations so a future external-crosswalk release can add
    them without changing the core table names or grains.
  text_normalization_policy: >-
    Every public chamber, origin_chamber, and current_chamber value is trimmed
    and lowercase. Null and empty source values remain null; no chamber is
    inferred solely from casing.
naming:
  main_table_count: 11
  main_tables:
    - bills
    - amendments
    - committees
    - committee_meetings
    - committee_prints
    - committee_reports
    - congresses
    - hearings
    - members
    - nominations
    - treaties
  child_table_rule: "<main_table>_<published_csv_suffix>"
source_policy:
  archive_release: 2025
  archive_directory: /tmp/bicam-published
  archive_format: zip containing UTF-8 CSV files
  authoritative_source: Congress.gov and GovInfo APIs
  compatibility_reference: >-
    The published 2025 archives define the public feature set, table names,
    column order, stable identifier forms, and relational grains. They are a
    compatibility reference rather than a row-for-row ceiling on the updated
    product.
  row_policy: >-
    Publish the canonical union of current official-source records at the
    published grains. Preserve source nulls and documented one-sided records;
    do not remove newer API rows merely to reproduce 2025 archive counts. Do
    not manufacture joins from legacy identifiers; relationships are
    represented only by source evidence, declared foreign keys, or a deferred
    external crosswalk.
  provenance_columns: >-
    The loader must retain archive release, archive filename, source CSV name,
    and load timestamp in ingestion metadata (these are not repeated in every
    public relation).
materialization:
  target: PostgreSQL
  schema: bicam
  expectation: >-
    Materialize each relation below as a durable table (not an ephemeral view),
    preserving declared columns and keys. Upsert roots and children by their
    declared key; retain source history in ingestion storage.
  identifier_policy: >-
    Published *_id, *_code, and *_number values are source identifiers and are
    not replaced by generated UUIDs. A composite key is used where a CSV has no
    single row identifier.
  feature_status_semantics:
    core-now: >-
      Publish the relation as a durable bicam table in the current product;
      source nulls remain nullable and source history remains in ingestion
      storage.
    deferred-external-crosswalk: >-
      Capture the CSV as source evidence, but do not expose it as a core public
      table until the required legacy/external identifier crosswalk is reviewed.
  timestamp_policy: "Use timestamptz for *_at and updated_at; use date for calendar dates."
families:
  - name: bills
    table: bills
    source_archive: bills.zip
    source_file: bills.csv
    purpose: Introduced bills and resolutions and their published bill metadata.
    grain: one published bill identified by bill_id
    primary_key: [bill_id]
    required_columns: [bill_id, bill_type, bill_number, congress]
    feature_status: core-now
    materialization: {mode: table, expectation: durable current row plus ingestion history}
    columns:
      bill_id: text
      bill_type: text
      bill_number: numeric
      congress: integer
      title: text
      origin_chamber: text
      current_chamber: text
      version_code: text
      introduced_at: timestamptz
      constitutional_authority_statement: text
      is_law: boolean
      is_appropriation: boolean
      is_private: boolean
      policy_area: text
      pages: integer
      actions_count: integer
      amendments_count: integer
      committees_count: integer
      cosponsors_count: integer
      summaries_count: integer
      subjects_count: integer
      titles_count: integer
      texts_count: integer
      updated_at: timestamptz
    children:
      - {table: bills_actions, source_file: bills_actions.csv, purpose: Bill actions, grain: one action, primary_key: [action_id], required_columns: [action_id, bill_id], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {action_id: text, bill_id: text, action_code: text, action_date: date, text: text, action_type: text, source_system: text, source_system_code: text, calendar: text, calendar_number: integer}}
      - {table: bills_actions_committees, source_file: bills_actions_committees.csv, purpose: Committees named on an action, grain: one action-to-committee edge, primary_key: [action_id, committee_code], required_columns: [action_id, bill_id, committee_code], foreign_keys: {action_id: bills_actions.action_id, bill_id: bills.bill_id, committee_code: committees.committee_code}, feature_status: core-now, columns: {action_id: text, bill_id: text, committee_code: text}}
      - {table: bills_actions_recorded_votes, source_file: bills_actions_recorded_votes.csv, purpose: Recorded vote associated with an action, grain: one action-to-roll-call observation, primary_key: [action_id, chamber, congress, session, roll_number], required_columns: [action_id, bill_id, chamber, congress, session, roll_number], foreign_keys: {action_id: bills_actions.action_id, bill_id: bills.bill_id}, feature_status: core-now, columns: {action_id: text, bill_id: text, chamber: text, congress: integer, date: date, roll_number: integer, session: integer, url: text}}
      - {table: bills_cbocostestimates, source_file: bills_cbocostestimates.csv, purpose: CBO cost estimate, grain: one bill estimate document, primary_key: [bill_id, url], required_columns: [bill_id, url], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, description: text, pub_date: date, title: text, url: text}}
      - {table: bills_cosponsors, source_file: bills_cosponsors.csv, purpose: Bill cosponsor edge, grain: one bill-to-member edge, primary_key: [bill_id, bioguide_id], required_columns: [bill_id, bioguide_id], foreign_keys: {bill_id: bills.bill_id, bioguide_id: members.bioguide_id}, feature_status: core-now, columns: {bill_id: text, bioguide_id: text}}
      - {table: bills_laws, source_file: bills_laws.csv, purpose: Bill-to-law reference, grain: one bill-to-law edge, primary_key: [bill_id, law_id], required_columns: [bill_id, law_id], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, law_id: text, law_number: text, law_type: text}}
      - {table: bills_lobbied, source_file: bills_lobbied.csv, purpose: Published lobbying filing linkage, grain: one filing-to-bill edge, primary_key: [filing_uuid, bill_id], required_columns: [filing_uuid, bill_id], foreign_keys: {bill_id: bills.bill_id}, feature_status: deferred-external-crosswalk, materialization: {mode: deferred, expectation: retain source evidence; withhold from core public schema pending an authoritative LDA source and stable bill crosswalk}, columns: {filing_uuid: text, general_issue_code: text, bill_id: text, is_implementation: boolean}}
      - {table: bills_metadata, source_file: bills_metadata.csv, purpose: GovInfo and legacy metadata for a bill, grain: one bill metadata record, primary_key: [bill_id], required_columns: [bill_id], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, govinfo_package_id: text, su_doc_class_number: text, migrated_doc_id: text, stock_number: text, child_ils_system_id: text, parent_ils_system_id: text, govinfo_collection_code: text}}
      - {table: bills_notes, source_file: bills_notes.csv, purpose: Bill note, grain: one numbered note per bill, primary_key: [bill_id, note_number], required_columns: [bill_id, note_number], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, note_number: integer, note_text: text, updated_at: timestamptz}}
      - {table: bills_notes_links, source_file: bills_notes_links.csv, purpose: Link embedded in a bill note, grain: one note link, primary_key: [bill_id, note_number, link_url], required_columns: [bill_id, note_number, link_url], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, note_number: integer, link_name: text, link_url: text, updated_at: timestamptz}}
      - {table: bills_reference_codes, source_file: bills_reference_codes.csv, purpose: Bill reference-code mapping, grain: one bill code reference, primary_key: [bill_code_id], required_columns: [bill_code_id, bill_id], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_code_id: text, bill_id: text, reference_code: text}}
      - {table: bills_reference_codes_sections, source_file: bills_reference_codes_sections.csv, purpose: Section of a reference-code mapping, grain: one code-section row, primary_key: [bill_code_id, code_section], required_columns: [bill_code_id, code_section], foreign_keys: {bill_code_id: bills_reference_codes.bill_code_id}, feature_status: core-now, columns: {bill_code_id: text, code_section: text}}
      - {table: bills_reference_laws, source_file: bills_reference_laws.csv, purpose: Bill law reference mapping, grain: one bill-to-law reference, primary_key: [bill_id, law_id, law_type], required_columns: [bill_id, law_id, law_type], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, law_id: text, law_type: text}}
      - {table: bills_reference_statutes, source_file: bills_reference_statutes.csv, purpose: Bill statute reference mapping, grain: one bill statute reference, primary_key: [bill_statute_id], required_columns: [bill_statute_id, bill_id], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_statute_id: text, bill_id: text, reference_statute: text}}
      - {table: bills_reference_statutes_pages, source_file: bills_reference_statutes_pages.csv, purpose: Page or page range in a statute reference, grain: one statute-reference page expression, primary_key: [bill_statute_id, page], required_columns: [bill_statute_id, page], foreign_keys: {bill_statute_id: bills_reference_statutes.bill_statute_id}, feature_status: core-now, columns: {bill_statute_id: text, page: text}}
      - {table: bills_related_bills, source_file: bills_related_bills.csv, purpose: Related bill edge, grain: one bill-to-related-bill edge, primary_key: [bill_id, related_bill_id], required_columns: [bill_id, related_bill_id], foreign_keys: {bill_id: bills.bill_id, related_bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, related_bill_id: text, identification_entity: text}}
      - {table: bills_sponsors, source_file: bills_sponsors.csv, purpose: Bill sponsor edge, grain: one bill-to-member sponsor edge, primary_key: [bill_id, bioguide_id], required_columns: [bill_id, bioguide_id], foreign_keys: {bill_id: bills.bill_id, bioguide_id: members.bioguide_id}, feature_status: core-now, columns: {bill_id: text, bioguide_id: text}}
      - {table: bills_subjects, source_file: bills_subjects.csv, purpose: Bill subject, grain: one subject assigned to a bill, primary_key: [bill_id, subject], required_columns: [bill_id, subject], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, subject: text, updated_at: timestamptz}}
      - {table: bills_summaries, source_file: bills_summaries.csv, purpose: Bill summary, grain: one summary version per bill, primary_key: [bill_id, version_code], required_columns: [bill_id, version_code, text], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, action_date: date, action_desc: text, text: text, version_code: text}}
      - {table: bills_texts, source_file: bills_texts.csv, purpose: Bill text rendition, grain: one source text rendition observation; date may be unavailable and the published columns do not uniquely identify every historical rendition, key_semantics: grouping, grouping_key: [bill_id, type], export_order: [bill_id, type, date, formatted_text, raw_text, pdf, xml], required_columns: [bill_id, type], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, date: date, type: text, raw_text: text, formatted_text: text, pdf: text, xml: text}}
      - {table: bills_titles, source_file: bills_titles.csv, purpose: Bill title, grain: one typed title per bill, primary_key: [bill_id, title_type, title], required_columns: [bill_id, title_type, title], foreign_keys: {bill_id: bills.bill_id}, feature_status: core-now, columns: {bill_id: text, title: text, title_type: text, bill_text_version_code: text, bill_text_version_name: text, chamber: text, title_type_code: text}}

