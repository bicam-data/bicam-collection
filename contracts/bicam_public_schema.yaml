# Supplemental relations are deliberately outside the eleven published
# families.  They are release-facing tables with a stable, documented grain,
# but do not alter the feature-parity archive contract above.
supplemental_relations:
  - table: bills_versions
    source_file: null
    purpose: >-
      Every GovInfo BILLS package/version linked to the canonical bill. This
      preserves version-level evidence while the core bills table exposes one
      representative version code; authenticated GovInfo HTML URLs and their
      extracted visible text are retained when published.
    grain: one GovInfo bill package/version
    primary_key: [govinfo_package_id]
    required_columns: [govinfo_package_id, bill_id, version_code]
    foreign_keys: {bill_id: bills.bill_id}
    feature_status: supplemental
    materialization: {mode: table, expectation: durable current row plus ingestion history}
    columns:
      bill_id: text
      govinfo_package_id: text
      version_code: text
      version_variant: integer
      rendition_suffix: text
      starprint_number: integer
      formatted_text: text
      raw_text: text
      title: text
      short_title: text
      issued_at: date
      last_modified: timestamptz
      is_representative_package: boolean
  - table: bills_version_links
    source_file: null
    purpose: >-
      Deterministic links from Congress.gov bill titles, text renditions, and
      explicitly version-labelled actions to GovInfo bill versions. Congress
      summary version codes are intentionally not treated as bill-text
      version codes and are therefore excluded.
    grain: one source child row-to-version link
    primary_key: [link_id]
    required_columns: [link_id, source_table, source_row_key, bill_id, link_status]
    foreign_keys: {bill_id: bills.bill_id}
    feature_status: supplemental
    materialization: {mode: table, expectation: durable current row plus ingestion history}
    columns:
      link_id: text
      source_table: text
      source_row_key: text
      bill_id: text
      source_version_code: text
      source_version_name: text
      govinfo_package_id: text
      govinfo_version_code: text
      link_status: text
      link_rule: text
      link_confidence: numeric_2
