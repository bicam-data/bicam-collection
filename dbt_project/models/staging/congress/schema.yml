version: 2

models:
  - name: stg_congress__crs_reports
    description: CRS product records from the Congress.gov CRS catalog; coverage follows the source catalog and is not a 1789-present claim.
    columns:
      - name: crs_report_id
        tests: [not_null, unique]
      - name: content_type
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: updated_at
        tests: [not_null]

  - name: stg_congress__crs_report_detail
    columns:
      - name: crs_report_id
        tests: [not_null, unique]
      - name: content_type
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: updated_at
        tests: [not_null]

  - name: stg_congress__house_votes
    description: Beta House roll call vote records, explicitly limited to the documented 118th and 119th Congresses.
    columns:
      - name: vote_identifier
        tests: [not_null, unique]
      - name: congress
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [118, 119]
      - name: session_number
        tests: [not_null]
      - name: roll_call_number
        tests: [not_null]
      - name: updated_at
        tests: [not_null]

  - name: stg_congress__house_vote_detail
    columns:
      - name: vote_identifier
        tests: [not_null, unique]
      - name: congress
        tests:
