        description: >-
          Chamber reported by the preferred Congress.gov source record before
          joint-committee normalization. Multiple raw chamber representations
          remain in the immutable archive; the canonical row prefers an
          explicit Joint payload, then a J.Hrg citation, then the newest source.
        tests: [not_null]
