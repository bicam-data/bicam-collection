version: 2

models:
  - name: int_govinfo_identity_fields
    description: >-
      Recursive audit of Bioguide, Thomas, and authority identifier fields in
      every GovInfo bill, committee-report, hearing, and committee-print
      package/granule JSON subfield. Raw values, source key spellings, JSONPath
      patterns, and validation status are retained for review.
    columns:
      - name: raw_id
        tests: [not_null]
      - name: json_path
        tests: [not_null]
      - name: json_key
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - bioGuideId
                  - bioguideId
                  - bioguideID
                  - bioGuideID
                  - bioguide_id
                  - thomasId
                  - thomasID
                  - thomas_id
                  - authorityId
                  - authorityID
                  - authority_id
      - name: identity_field
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bioguide_id, thomas_id, authority_id]
      - name: identity_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [valid_bioguide, invalid_bioguide, identifier_candidate, resolved_authority_name, reviewed_authority_exception, non_identifier_text, unclassified]
