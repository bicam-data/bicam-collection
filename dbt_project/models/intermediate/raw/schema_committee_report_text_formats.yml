version: 2

models:
  - name: int_congress_committee_report_text_formats
    description: Stable expansion of committee-report text and format arrays.
    columns:
      - name: format_key
        tests: [not_null, unique]
      - name: report_id
        tests: [not_null]
      - name: report_part_id
        tests: [not_null]
      - name: raw_response_version_id
        tests: [not_null]
      - name: report_detail_raw_id
        description: Raw detail response that owns the resolved text child.
        tests: [not_null]
      - name: report_source_raw_response_version_id
        description: Raw version of the detail payload that supplied the report identity for this text format.
        tests: [not_null]
