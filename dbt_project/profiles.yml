bicam_collection:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5433') | int }}"
      user: "{{ env_var('DB_USER', 'admin') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_NAME', 'bicam_collection') }}"
      schema: "{{ env_var('DB_SCHEMA', 'public') }}"
      application_name: "{{ env_var('PGAPPNAME', 'dbt') }}"
      threads: 4
