name: bicam_collection
version: 1.0.0
config-version: 2
profile: bicam_collection

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  bicam_collection:
    intermediate:
      +materialized: table
      raw:
        +materialized: incremental
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  bicam_collection:
    +quote_columns: false
    reconciliation:
      # Decision seeds written by scripts/reconcile.py. Pin every column so
      # an empty or newly edited file never changes the inferred table types
      # (an empty seed is otherwise created with all-integer columns).
      bill_match_overrides:
        +column_types:
          congress_source_record_id: text
          govinfo_source_record_id: text
          decision: text
          reviewer: text
          reviewed_at: timestamp
          reason: text
          expires_at: timestamp
          contract_version: text
      committee_report_match_overrides:
        +column_types:
          congress_source_record_id: text
          govinfo_source_record_id: text
          decision: text
          reviewer: text
          reviewed_at: timestamp
          reason: text
          expires_at: timestamp
          contract_version: text
      reconciliation_exception_reviews:
        +column_types:
          entity: text
          canonical_id: text
          disposition: text
          reviewer: text
          reviewed_at: timestamp
          reason: text
          expires_at: timestamp
          contract_version: text
      govinfo_member_identity_overrides:
        +column_types:
          source_member_key: text
          committee_id: text
          congress: integer
          state: text
          member_name: text
          bioguide_id: text
          reviewer: text
          reviewed_at: date
          reason: text
          expires_at: date
      govinfo_committee_id_overrides:
        +column_types:
          source_committee_id: text
          committee_id: text
          reviewer: text
          reviewed_at: date
          reason: text
          expires_at: date
      govinfo_committee_id_exceptions:
        +column_types:
          source_committee_id: text
          classification: text
          reviewer: text
          reviewed_at: date
          reason: text
          expires_at: date
      govinfo_member_reference_reviews:
        +column_types:
          source_member_reference_key: text
          classification: text
          reviewer: text
          reviewed_at: date
          reason: text
          expires_at: date
      govinfo_congressional_directory_committee_assignments:
        +column_types:
          source_package_id: text
          source_granule_id: text
          source_url: text
          source_date: date
          congress: integer
          chamber: text
          member_name: text
          member_state: text
          bioguide_id: text
          member_match_status: text
          committee_name: text
          subcommittee_name: text
          committee_code: text
          committee_match_status: text
          role: text
          source_text_sha256: text
    bootstrap:
      bootstrap_congresses_directories_isbn:
        +column_types:
          congress_number: integer
          govinfo_package_id: text
          isbn: text
