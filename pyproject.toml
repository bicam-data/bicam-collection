[project]
name = "bicam-collection"
version = "0.1.0"
description = "Spec-driven raw crawler and dbt staging foundation for Congress.gov data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dbt-core>=1.11.7",
  "dbt-postgres>=1.10.0",
  "psycopg-pool>=3.2.2",
  "psycopg[binary]>=3.2.9",
  "PyYAML>=6.0.2",
  "pyarrow>=18.0.0",
  "rotisserie[requests]",
  "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
  "types-pyyaml>=6.0.12.20260815",
  "types-requests>=2.33.0.20260712",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bicam_collection"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
rotisserie = { path = "../rotisserie", editable = true }

[[tool.mypy.overrides]]
module = ["rotisserie", "rotisserie.*"]
ignore_missing_imports = true
