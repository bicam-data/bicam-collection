[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bicam-collection"
version = "0.2.0"
description = "Modern ELT pipeline for processing congressional and government data"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Ryan Delano"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"

dependencies = [
    # Core data processing
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "polars>=0.19.0",
    # Database
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    # Configuration & Environment
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # HTTP & API
    "aiohttp>=3.9.0",
    "httpx>=0.24.0",
    "ujson>=5.8.0",
    # AWS & Cloud
    "boto3>=1.37.34",
    "botocore>=1.37.34",
    # Utilities
    "tqdm>=4.66.0",
    "rapidfuzz>=3.5.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.8.0",
    # Logging & Monitoring
    "structlog>=23.2.0",
    "python-json-logger>=2.0.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0", 
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.3.0",
    
    # Code quality
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    
    # Documentation
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    
    # Development tools
    "ipython>=8.17.0",
    "jupyter>=1.0.0",
]

dagster = [
    "dagster>=1.5.0",
    "dagster-postgres>=0.21.0",
    "dagster-webserver>=1.5.0",
]

all = [
    "bicam-collection[dev,dagster]"
]

[project.urls]
Homepage = "https://github.com/your-username/bicam-collection"
Repository = "https://github.com/your-username/bicam-collection.git"
Documentation = "https://bicam-collection.readthedocs.io"
"Bug Reports" = "https://github.com/your-username/bicam-collection/issues"

[project.scripts]
bicam = "bicam_collection.cli:cli_main"

# Package discovery
[tool.hatch.build.targets.wheel]
packages = ["src/bicam_collection", "src/pycon"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
]

# Development tools configuration
[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["bicam_collection"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings  
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
unfixable = ["T20"]  # Don't auto-remove print statements

[tool.ruff.per-file-ignores]
"tests/**/*" = ["T20"]  # Allow print statements in tests
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "psycopg2.*",
    "boto3.*",
    "botocore.*",
    "rapidfuzz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--cov=src/bicam_collection",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/bicam_collection/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
