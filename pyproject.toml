[project]
name = "bicam-collection"
version = "0.1.0"
description = "Spec-driven raw crawler and dbt staging foundation for Congress.gov data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dbt-core>=1.11.7",
  "dbt-postgres>=1.10.0",
  "psycopg-pool>=3.2.2",
  "psycopg[binary]>=3.2.9",
  "PyYAML>=6.0.2",
  "rotisserie[requests]",
  "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bicam_collection"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
rotisserie = { path = "../rotisserie", editable = true }
