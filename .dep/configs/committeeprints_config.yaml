# Configuration for Congressional Committeeprints Data Type
# This file defines the schema structure and processing rules for committeeprints data

data_type: "committeeprints"
api_data_type: "committee-print"  # Used in Congressional API endpoints

# Database schemas
schemas:
  raw: "bicam_raw_congressional"
  staging: "bicam_staging_congressional" 
  production: "bicam_congressional"

# Table configurations
tables:
  # Main committeeprints table
  - name: "committeeprints"
    table_name: "committeeprints"
    is_main: true
    create_raw: true
    id_fields: ["committeeprints_id"]
    nested_fields: []  # TODO: Define nested fields from API response
    
    fields:
      - name: "committeeprints_id"
        type: "varchar"
        max_length: 50
        nullable: false
        description: "Unique committeeprint identifier"
      
      # TODO: Add more fields based on Congressional API response structure
      - name: "congress"
        type: "integer"
        nullable: true
        description: "Congress number"
      
      - name: "update_date"
        type: "datetime"
        nullable: true
        description: "Last update date"

  # TODO: Add related tables as needed based on API structure
  # Example related tables:
  # - committeeprints_actions
  # - committeeprints_texts
