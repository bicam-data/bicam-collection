# Configuration for Congressional Committeereports Data Type
# This file defines the schema structure and processing rules for committeereports data

data_type: "committeereports"
api_data_type: "committee-report"  # Used in Congressional API endpoints

# Database schemas
schemas:
  raw: "bicam_raw_congressional"
  staging: "bicam_staging_congressional" 
  production: "bicam_congressional"

# Table configurations
tables:
  # Main committeereports table
  - name: "committeereports"
    table_name: "committeereports"
    is_main: true
    create_raw: true
    id_fields: ["committeereports_id"]
    nested_fields: []  # TODO: Define nested fields from API response
    
    fields:
      - name: "committeereports_id"
        type: "varchar"
        max_length: 50
        nullable: false
        description: "Unique committeereport identifier"
      
      # TODO: Add more fields based on Congressional API response structure
      - name: "congress"
        type: "integer"
        nullable: true
        description: "Congress number"
      
      - name: "update_date"
        type: "datetime"
        nullable: true
        description: "Last update date"

  # TODO: Add related tables as needed based on API structure
  # Example related tables:
  # - committeereports_actions
  # - committeereports_texts
