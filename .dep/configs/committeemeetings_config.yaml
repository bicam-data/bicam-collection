# Configuration for Congressional Committeemeetings Data Type
# This file defines the schema structure and processing rules for committeemeetings data

data_type: "committeemeetings"
api_data_type: "committee-meeting"  # Used in Congressional API endpoints

# Database schemas
schemas:
  raw: "bicam_raw_congressional"
  staging: "bicam_staging_congressional" 
  production: "bicam_congressional"

# Table configurations
tables:
  # Main committeemeetings table
  - name: "committeemeetings"
    table_name: "committeemeetings"
    is_main: true
    create_raw: true
    id_fields: ["committeemeetings_id"]
    nested_fields: []  # TODO: Define nested fields from API response
    
    fields:
      - name: "committeemeetings_id"
        type: "varchar"
        max_length: 50
        nullable: false
        description: "Unique committeemeeting identifier"
      
      # TODO: Add more fields based on Congressional API response structure
      - name: "congress"
        type: "integer"
        nullable: true
        description: "Congress number"
      
      - name: "update_date"
        type: "datetime"
        nullable: true
        description: "Last update date"

  # TODO: Add related tables as needed based on API structure
  # Example related tables:
  # - committeemeetings_actions
  # - committeemeetings_texts
