# Configuration for Congressional Treaties Data Type
# This file defines the schema structure and processing rules for treaties data

data_type: "treaties"
api_data_type: "treaty"  # Used in Congressional API endpoints

# Database schemas
schemas:
  raw: "bicam_raw_congressional"
  staging: "bicam_staging_congressional" 
  production: "bicam_congressional"

# Table configurations
tables:
  # Main treaties table
  - name: "treaties"
    table_name: "treaties"
    is_main: true
    create_raw: true
    id_fields: ["treaties_id"]
    nested_fields: []  # TODO: Define nested fields from API response
    
    fields:
      - name: "treaties_id"
        type: "varchar"
        max_length: 50
        nullable: false
        description: "Unique treaty identifier"
      
      # TODO: Add more fields based on Congressional API response structure
      - name: "congress"
        type: "integer"
        nullable: true
        description: "Congress number"
      
      - name: "update_date"
        type: "datetime"
        nullable: true
        description: "Last update date"

  # TODO: Add related tables as needed based on API structure
  # Example related tables:
  # - treaties_actions
  # - treaties_texts
