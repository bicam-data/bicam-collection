# Configuration for Congressional Members Data Type
# This file defines the schema structure and processing rules for members data

data_type: "members"
api_data_type: "member"  # Used in Congressional API endpoints

# Database schemas
schemas:
  raw: "bicam_raw_congressional"
  staging: "bicam_staging_congressional" 
  production: "bicam_congressional"

# Table configurations
tables:
  # Main members table
  - name: "members"
    table_name: "members"
    is_main: true
    create_raw: true
    id_fields: ["members_id"]
    nested_fields: []  # TODO: Define nested fields from API response
    
    fields:
      - name: "members_id"
        type: "varchar"
        max_length: 50
        nullable: false
        description: "Unique member identifier"
      
      # TODO: Add more fields based on Congressional API response structure
      - name: "congress"
        type: "integer"
        nullable: true
        description: "Congress number"
      
      - name: "update_date"
        type: "datetime"
        nullable: true
        description: "Last update date"

  # TODO: Add related tables as needed based on API structure
  # Example related tables:
  # - members_actions
  # - members_texts
