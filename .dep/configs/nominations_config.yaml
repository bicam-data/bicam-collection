# Configuration for Congressional Nominations Data Type
# This file defines the schema structure and processing rules for nominations data

data_type: "nominations"
api_data_type: "nomination"  # Used in Congressional API endpoints

# Database schemas
schemas:
  raw: "bicam_raw_congressional"
  staging: "bicam_staging_congressional" 
  production: "bicam_congressional"

# Table configurations
tables:
  # Main nominations table
  - name: "nominations"
    table_name: "nominations"
    is_main: true
    create_raw: true
    id_fields: ["nominations_id"]
    nested_fields: []  # TODO: Define nested fields from API response
    
    fields:
      - name: "nominations_id"
        type: "varchar"
        max_length: 50
        nullable: false
        description: "Unique nomination identifier"
      
      # TODO: Add more fields based on Congressional API response structure
      - name: "congress"
        type: "integer"
        nullable: true
        description: "Congress number"
      
      - name: "update_date"
        type: "datetime"
        nullable: true
        description: "Last update date"

  # TODO: Add related tables as needed based on API structure
  # Example related tables:
  # - nominations_actions
  # - nominations_texts
