# Configuration for Congressional Congresses Data Type
# This file defines the schema structure and processing rules for congresses data

data_type: "congresses"
api_data_type: "congress"  # Used in Congressional API endpoints

# Database schemas
schemas:
  raw: "bicam_raw_congressional"
  staging: "bicam_staging_congressional" 
  production: "bicam_congressional"

# Table configurations
tables:
  # Main congresses table
  - name: "congresses"
    table_name: "congresses"
    is_main: true
    create_raw: true
    id_fields: ["congresses_id"]
    nested_fields: []  # TODO: Define nested fields from API response
    
    fields:
      - name: "congresses_id"
        type: "varchar"
        max_length: 50
        nullable: false
        description: "Unique congress identifier"
      
      # TODO: Add more fields based on Congressional API response structure
      - name: "congress"
        type: "integer"
        nullable: true
        description: "Congress number"
      
      - name: "update_date"
        type: "datetime"
        nullable: true
        description: "Last update date"

  # TODO: Add related tables as needed based on API structure
  # Example related tables:
  # - congresses_actions
  # - congresses_texts
