# Configuration for Congressional Hearings Data Type
# This file defines the schema structure and processing rules for hearings data

data_type: "hearings"
api_data_type: "hearing"  # Used in Congressional API endpoints

# Database schemas
schemas:
  raw: "bicam_raw_congressional"
  staging: "bicam_staging_congressional" 
  production: "bicam_congressional"

# Table configurations
tables:
  # Main hearings table
  - name: "hearings"
    table_name: "hearings"
    is_main: true
    create_raw: true
    id_fields: ["hearings_id"]
    nested_fields: []  # TODO: Define nested fields from API response
    
    fields:
      - name: "hearings_id"
        type: "varchar"
        max_length: 50
        nullable: false
        description: "Unique hearing identifier"
      
      # TODO: Add more fields based on Congressional API response structure
      - name: "congress"
        type: "integer"
        nullable: true
        description: "Congress number"
      
      - name: "update_date"
        type: "datetime"
        nullable: true
        description: "Last update date"

  # TODO: Add related tables as needed based on API structure
  # Example related tables:
  # - hearings_actions
  # - hearings_texts
